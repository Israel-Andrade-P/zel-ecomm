spring:
  application:
    name: zel-e-comm
  datasource:
    url: jdbc:postgresql://localhost:5432/ecomm
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      ##less db overhead when using @Transactional due to not having to commit every single SQL statement individually rather all in one single commit
      auto-commit: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    ##db connection is returned to conn pool when transaction ends as opposite to being held up all the way to controller(view)
    open-in-view: false
project:
  path:
    images: ./images
    url: http://localhost:8080/images

jwt: 
  expiration: 86400000
  secret: ${JWT_SECRET}
  cookie: access_token_z

frontend:
  url: http://localhost:5173

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}
